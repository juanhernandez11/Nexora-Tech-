[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Cache de assets estáticos ────────────────────────────────────────────────
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ─── Canonical: Forzar HTTPS en nexorate.netlify.app ─────────────────────────
# Nota: el dominio canónico es nexorate.netlify.app
# Este redirect evita que Google indexe la versión HTTP como duplicado

[[redirects]]
  from = "http://nexorate.netlify.app/*"
  to = "https://nexorate.netlify.app/:splat"
  status = 301
  force = true

# ─── Prevención de contenido duplicado ───────────────────────────────────────
# Si alguna vez usas un dominio personalizado (ej. nexoratech.com),
# redirige aquí hacia el canónico. Por ahora apunta al mismo Netlify.
# Descomenta y ajusta cuando tengas dominio propio:
# [[redirects]]
#   from = "https://www.nexoratech.com/*"
#   to = "https://nexorate.netlify.app/:splat"
#   status = 301
#   force = true

# ─── Prevención de /es/ duplicado ────────────────────────────────────────────
# next-intl con localePrefix: as-needed sirve español sin prefijo /es/.
# Si alguien llega a /es/*, lo redirigimos a /* para evitar contenido duplicado.
[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es"
  to = "/"
  status = 301
  force = true
