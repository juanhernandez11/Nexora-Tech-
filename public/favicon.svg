<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado con gradiente brand -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Bracket izquierdo -->
  <path d="M28 32 L18 50 L28 68" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Bracket derecho -->
  <path d="M72 32 L82 50 L72 68" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Punto central con gradiente cian (acento de marca) -->
  <circle cx="50" cy="50" r="9" fill="url(#dot)"/>

  <!-- Línea horizontal sutil -->
  <line x1="41" y1="50" x2="59" y2="50" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
</svg>
